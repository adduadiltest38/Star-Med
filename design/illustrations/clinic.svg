<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCEBFF"/><stop offset="1" stop-color="#F3F8FD"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF4FB"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#84B3FA"/><stop offset="1" stop-color="#2DBFBD"/></linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1659C4"/><stop offset="1" stop-color="#13A3A3"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#sky)"/>
  <circle cx="980" cy="160" r="70" fill="#fff" opacity="0.9"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="240" cy="150" rx="90" ry="28"/><ellipse cx="300" cy="130" rx="60" ry="30"/><ellipse cx="820" cy="230" rx="70" ry="20"/></g>
  <!-- trees -->
  <g><rect x="120" y="560" width="16" height="160" fill="#7A5A3A"/><circle cx="128" cy="520" r="78" fill="#45BE80"/><circle cx="90" cy="560" r="50" fill="#22A365"/><circle cx="168" cy="570" r="46" fill="#22A365"/></g>
  <g><rect x="1064" y="580" width="14" height="140" fill="#7A5A3A"/><circle cx="1070" cy="550" r="66" fill="#22A365"/><circle cx="1110" cy="590" r="40" fill="#45BE80"/></g>
  <!-- building -->
  <rect x="230" y="300" width="740" height="420" rx="10" fill="url(#wall)" stroke="#D3DFEC" stroke-width="3"/>
  <rect x="210" y="280" width="780" height="40" rx="12" fill="#E3ECF6"/>
  <rect x="230" y="340" width="740" height="64" fill="url(#band)"/>
  <!-- emblem on band -->
  <g transform="translate(600 372)">
    <circle r="44" fill="#fff"/>
    <g fill="#22A365"><rect x="-10" y="-28" width="20" height="56" rx="6"/><rect x="-28" y="-10" width="56" height="20" rx="6"/></g>
  </g>
  <!-- windows -->
  <g fill="url(#glass)" opacity="0.85">
    <rect x="270" y="440" width="140" height="110" rx="10"/><rect x="430" y="440" width="100" height="110" rx="10"/>
    <rect x="670" y="440" width="100" height="110" rx="10"/><rect x="790" y="440" width="140" height="110" rx="10"/>
  </g>
  <g stroke="#fff" stroke-width="4" opacity="0.8"><path d="M340 440v110M480 440v110M720 440v110M860 440v110"/></g>
  <!-- door -->
  <rect x="548" y="470" width="104" height="250" rx="10" fill="url(#glass)"/>
  <path d="M600 470v250" stroke="#fff" stroke-width="5"/>
  <rect x="520" y="440" width="160" height="22" rx="8" fill="#13A3A3"/>
  <!-- planters + ground -->
  <rect x="0" y="716" width="1200" height="184" fill="#D5E4F5"/>
  <rect x="0" y="716" width="1200" height="14" fill="#C2D6EE"/>
  <path d="M480 900 L548 720 h104 L720 900z" fill="#E9F0F8"/>
  <g><rect x="270" y="660" width="80" height="56" rx="10" fill="#fff" stroke="#D3DFEC" stroke-width="3"/><circle cx="310" cy="640" r="34" fill="#45BE80"/></g>
  <g><rect x="850" y="660" width="80" height="56" rx="10" fill="#fff" stroke="#D3DFEC" stroke-width="3"/><circle cx="890" cy="640" r="34" fill="#45BE80"/></g>
</svg>
